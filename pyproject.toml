[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinontoscreen"
version = "0.1.1"
description = "Ontology-guided NHANES screening prioritization research prototype"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "rdflib>=7.0",
  "streamlit>=1.38",
  "plotly>=5.20",
  "networkx>=3.2",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
